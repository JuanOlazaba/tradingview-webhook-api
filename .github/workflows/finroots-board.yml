name: Finroots · consejo semanal

on:
  schedule:
    - cron: "17 10 * * 0"    # domingos, 11:17 Madrid (invierno)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finroots
  cancel-in-progress: false

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: finroots/requirements.txt
      - name: Instalar dependencias
        run: |
          pip install -r finroots/requirements.txt
      - name: Consejo de administración
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          FINROOTS_NEW_REFRESH_TOKEN_FILE: ${{ runner.temp }}/rt
        run: python -m finroots.cli board
      - name: Rotar el token de TikTok si ha cambiado
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -s "${{ runner.temp }}/rt" ] && [ -n "$GH_TOKEN" ]; then
            gh secret set TIKTOK_REFRESH_TOKEN --repo "${{ github.repository }}" < "${{ runner.temp }}/rt"
            echo "Token de TikTok actualizado"
          fi
      - name: Guardar estado, guiones y actas
        if: always()
        run: |
          git config user.name "finroots-bot"
          git config user.email "finroots-bot@users.noreply.github.com"
          git add finroots/state finroots/minutes finroots/episodes finroots/reports 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Finroots: consejo semanal $(date -u +%F)"
          git push
