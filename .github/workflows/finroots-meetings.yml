name: Finroots · reuniones de mejora (3 por semana)

on:
  schedule:
    - cron: "23 9 * * 1,3,5"   # lunes, miércoles y viernes 10:23 Madrid (invierno); un tema distinto cada vez
  workflow_dispatch:
    inputs:
      tema:
        description: "contenido | crecimiento | monetizacion | tecnologia | finanzas | riesgos (vacío = rotación)"
        type: string
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: finroots
  cancel-in-progress: false

jobs:
  meeting:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Partir del último estado
        run: git pull -q --ff-only origin main || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: finroots/requirements.txt
      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r finroots/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Reunión de mejora
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINROOTS_NEW_REFRESH_TOKEN_FILE: ${{ runner.temp }}/rt
        run: python -m finroots.cli improve ${{ inputs.tema }}
      - name: Guardar el vídeo si se recuperó el episodio del día
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finroots-recuperado-${{ github.run_number }}
          path: |
            finroots/episodes/*/video.mp4
            finroots/episodes/*/caption.txt
          if-no-files-found: ignore
          retention-days: 30
      - name: Rotar el token de TikTok si ha cambiado
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -s "${{ runner.temp }}/rt" ] && [ -n "$GH_TOKEN" ]; then
            gh secret set TIKTOK_REFRESH_TOKEN --repo "${{ github.repository }}" < "${{ runner.temp }}/rt"
            echo "Token de TikTok actualizado"
          fi
      - name: Guardar estado, guiones y actas
        if: always()
        run: |
          git config user.name "finroots-bot"
          git config user.email "finroots-bot@users.noreply.github.com"
          git add finroots/state finroots/minutes finroots/episodes finroots/reports finroots/PANEL.md finroots/bible.md finroots/config.yaml 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Finroots: reunión de mejora $(date -u +%F)"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep $((i*5)); done
