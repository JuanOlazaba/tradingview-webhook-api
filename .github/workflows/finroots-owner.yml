name: Finroots · respuesta del dueño

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: finroots
  cancel-in-progress: false

jobs:
  sync:
    if: contains(github.event.issue.labels.*.name, 'decision-dueño') && github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q PyYAML requests anthropic
      - name: Leer la respuesta y aplicarla
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m finroots.cli sync
      - name: Guardar
        run: |
          git config user.name "finroots-bot"
          git config user.email "finroots-bot@users.noreply.github.com"
          git add finroots/state finroots/PANEL.md finroots/config.yaml
          git diff --cached --quiet || git commit -m "Finroots: respuesta del dueño registrada"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep $((i*5)); done
